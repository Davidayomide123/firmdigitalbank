<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="signin.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <form action="">
      <div class="signup-image">
        <img src="/images/signup-image.jpg" alt="" />
      </div>

      <div class="details">
        <div class="bank-name">
          <img src="/images/logo-dark.svg" alt="" />
          <h1>Login</h1>
          <p>Welcome back, please sign in</p>
        </div>

        <div class="inputs">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="johndoe@gmail.com"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />

          <div class="consent">
            <input type="checkbox" id="remember" class="consent" />
            <p>Remember me &nbsp;•&nbsp; <strong>Forgot Password?</strong></p>
          </div>

           <button><a href="dashboard.html">Signin</a></button>


          <p class="alt-action">
            Don't have an account? <strong><a href="signup.html">Sign Up</a></strong>
          </p>

          <p class="alt-action2">
            <a href="index.html">Back to Home</a>
          </p>
        </div>
      </div>
    </form>
  </body>
</html>
