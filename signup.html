<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="signup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
  </head>
  <body>
    <form action="">
      <div class="signup-image">
        <img src="/images/signup-image.jpg" alt="" />
      </div>

      <div class="details">
        <div class="bank-name">
          <img src="/images/logo-dark.svg" alt="" />
          <h1>SignUp</h1>
          <p>lets create an account</p>
        </div>

        <div class="inputs">
          <label for="">First-name</label>
          <input type="text" placeholder="John" required />

          <label for="">Last-name</label>
          <input type="text" placeholder="Doe" required />

          <label for="email">Email Address</label>
          <input type="email" placeholder="johndoe@gmail.com" required />

          <label for="">Create a Passoword</label>
          <input type="password" name="" id="" required minlength="4" maxlength="16"/>

          <div class="consent">
            <input type="radio" name="" id="" class="consent" required />
            <p>I agree to the <strong>Privacy and Policy</strong></p>
          </div>

          <button><a href="dashboard.html">Create An Account</a></button>

          <p class="alt-action">
            Already have an Account? <strong><a href="signin.html">Sign in</a></strong>
          </p>

          <p class="alt-action2">
            <a href="index.html">Back to Home</a>
          </p>
        </div>
      </div>
    </form>
  </body>
</html>
