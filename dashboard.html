<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FirmBank Dashboard</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <h2 class="logo">FirmBank</h2>
    <nav>
      <a href="#" class="active">
        <img src="/images/house-chimney.svg" alt="Home">
        Home
      </a>
      <a href="#">
        <img src="/images/credit-card.svg" alt="Card">
        Card
      </a>
      <a href="#">
        <img src="/images/services.svg" alt="Services">
        Services
      </a>
      <a href="#">
        <img src="/images/growth-chart-invest.svg" alt="Rewards">
        Rewards
      </a>
    </nav>
  </aside>

  <main class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <img src="/images/logo-dark.svg" alt="" class="brand-logo">
        <div class="profile">
          <img src="/images/avatar.png" alt="avatar" class="avatar">
          <span class="level">Level 1</span>
        </div>
      </div>
      <button class="icon-btn">
        <img src="/images/bell.svg" alt="Notifications">
      </button>
    </header>

    <!-- Balance Card -->
    <section class="balance-card">
      <div class="card-holder">
        <p class="holder-name">Elanor Quen</p>
        <p class="holder-num">0144-510-2008</p>
      </div>

      <div class="card-balance">
        <p class="balance-label">Total Balance</p>
        <h1>$12,840.50</h1>
      </div>
    </section>

    <!-- Services / Quick Action -->
    <section class="services">
      <div class="section-head">
        <h3>Quick Action</h3>
        <a href="#">Edit</a>
      </div>

      <div class="service-grid">
        <a href="withdraw.html" class="service-item">
          <div class="service-circle">
            <img src="/images/deposit.svg" alt="Top Up">
          </div>
          <span>Withdraw</span>
        </a>
        <a href="ewallet.html" class="service-item">
          <div class="service-circle">
            <img src="/images/credit-card.svg" alt="E-Wallet">
          </div>
          <span>E-Wallet</span>
        </a>
        <a href="transfer.html" class="service-item">
          <div class="service-circle">
            <img src="/images/money-transfer-smartphone.svg" alt="Transfer">
          </div>
          <span>Deposit</span>
        </a>
        <a href="loans.html" class="service-item">
          <div class="service-circle">
            <img src="/images/calendar-payment-loan.svg" alt="Loans">
          </div>
          <span>Loans</span>
        </a>
      </div>
    </section>

    <!-- Transactions -->
    <section class="transactions">
      <div class="section-head">
        <h3>Recent Transactions</h3>
        <a href="#">View All</a>
      </div>

      <div class="txn-list">
        <div class="txn-item">
          <div class="txn-logo spotify">S</div>
          <div class="txn-info">
            <p class="txn-name">Spotify</p>
          </div>
          <div class="txn-right">
            <p class="txn-amount">-$9.99</p>
          </div>
        </div>

        <div class="txn-item">
          <div class="txn-logo netflix">N</div>
          <div class="txn-info">
            <p class="txn-name">Netflix</p>
          </div>
          <div class="txn-right">
            <p class="txn-amount">-$15.40</p>
          </div>
        </div>

        <div class="txn-item">
          <div class="txn-logo starbucks">S</div>
          <div class="txn-info">
            <p class="txn-name">Starbucks Coffee</p>
          </div>
          <div class="txn-right">
            <p class="txn-amount">-$4.75</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom nav (phone only) -->
  <nav class="bottom-nav">
    <a href="#" class="active">
      <img src="/images/house-chimney.svg" alt="Home">
      <span>Home</span>
    </a>
    <a href="card.html">
      <img src="/images/credit-card.svg" alt="Cards">
      <span>Cards</span>
    </a>
    <a href="settings.html">
      <img src="/images/user-skill-gear.svg" alt="Profile">
      <span>Settings</span>
    </a>
  </nav>

</div>

</body>
</html>
